{{template "head" .}}
<div style="max-width:420px;margin:40px auto 0">
  <h1 style="font-size:26px">注册</h1>
  <p class="lead" style="font-size:14px">需要邀请码。注册后自动获得初始额度。</p>
  {{if .Err}}<div class="alert err">{{.Err}}</div>{{end}}
  <form method="post" action="/register" class="card" style="margin-top:18px">
    <label for="name">用户名</label>
    <input id="name" name="name" autocomplete="username" minlength="3" maxlength="24" required>
    <label for="pass">密码（至少 8 位）</label>
    <input id="pass" name="pass" type="password" autocomplete="new-password" minlength="8" required>
    <label for="invite">邀请码</label>
    <input id="invite" name="invite" required>
    <button class="btn" style="margin-top:16px;width:100%" type="submit">创建账号</button>
  </form>
  <p class="muted" style="margin-top:14px">已有账号？<a href="/login">登录</a></p>
</div>
{{template "foot" .}}
